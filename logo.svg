<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#14213d"/>
      <stop offset="60%" stop-color="#0a0e17"/>
      <stop offset="100%" stop-color="#05070b"/>
    </radialGradient>

    <!-- Neon Brand Gradient -->
    <linearGradient id="neonBrand" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>

    <linearGradient id="neonAccent" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00b4d8"/>
      <stop offset="100%" stop-color="#90e0ef"/>
    </linearGradient>

    <!-- Play Button Gradient -->
    <linearGradient id="playGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="50%" stop-color="#38b6ff"/>
      <stop offset="100%" stop-color="#0072ff"/>
    </linearGradient>

    <!-- Border Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur1"/>
      <feGaussianBlur stdDeviation="20" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Drop Shadow for D & Play -->
    <filter id="iconShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#00f2fe" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- App Icon Base Squircle -->
  <rect x="8" y="8" width="496" height="496" rx="112" ry="112" fill="url(#bgGlow)" stroke="rgba(255,255,255,0.12)" stroke-width="3"/>
  <rect x="12" y="12" width="488" height="488" rx="108" ry="108" fill="none" stroke="url(#neonBrand)" stroke-width="2" stroke-opacity="0.3"/>

  <!-- Ambient Center Flare -->
  <circle cx="256" cy="220" r="140" fill="#00f2fe" opacity="0.08" filter="url(#neonGlow)"/>

  <!-- Broadcast Waves (Top Right) -->
  <g filter="url(#subtleGlow)" stroke="url(#neonBrand)" stroke-width="7" stroke-linecap="round" fill="none" opacity="0.9">
    <path d="M 330 145 A 75 75 0 0 1 385 200"/>
    <path d="M 352 125 A 105 105 0 0 1 428 200"/>
  </g>

  <!-- Main Monogram "D" Structure -->
  <g filter="url(#iconShadow)">
    <!-- Outer Bold Stylized 'D' Spine & Arc -->
    <path d="M 160 120 
             H 260 
             C 325 120, 368 165, 368 225 
             C 368 285, 325 330, 260 330 
             H 160 
             V 120 Z" 
          fill="none" 
          stroke="url(#neonBrand)" 
          stroke-width="26" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>

    <!-- Inner Play Symbol (Embedded with high depth) -->
    <path d="M 218 174 
             L 298 225 
             L 218 276 
             Z" 
          fill="url(#playGrad)" 
          stroke="#ffffff" 
          stroke-width="3" 
          stroke-linejoin="round"
          filter="url(#subtleGlow)"/>

    <!-- Play Button Center Sheen Highlight -->
    <path d="M 224 186 L 278 225 L 224 225 Z" fill="#ffffff" opacity="0.28"/>
  </g>

  <!-- Brand Typography: DERLENG TV -->
  <g text-anchor="middle">
    <text x="256" y="405" 
          font-family="'Plus Jakarta Sans', -apple-system, sans-serif" 
          font-size="40" 
          font-weight="900" 
          letter-spacing="5" 
          fill="#ffffff">
      DERLENG
    </text>
    
    <!-- TV Badge Pill -->
    <rect x="216" y="425" width="80" height="28" rx="8" ry="8" fill="url(#neonBrand)"/>
    <text x="256" y="445" 
          font-family="'Plus Jakarta Sans', -apple-system, sans-serif" 
          font-size="16" 
          font-weight="900" 
          letter-spacing="2" 
          fill="#030b17">
      LIVE TV
    </text>
  </g>
</svg>
